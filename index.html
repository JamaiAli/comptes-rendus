<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Comptes Rendus - TP / TD / Fiches</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="description" content="Comptes rendus de TP, TD et fiches - Informatique Fondamentale & Sécurité Informatique" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --theme-color: #35d1c1;
      --bg: #0a0e14;
      --bg-alt: #10151d;
      --border: #1e2733;
      --text: #c3ccd6;
      --text-dim: #6b7684;
      --heading: #e8edf2;
      --accent: #35d1c1;
      --accent-dim: #1f8f85;
      --code-bg: #0d1218;
    }

    html, body { background: var(--bg); }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
    }

    /* Sidebar */
    .sidebar {
      background: var(--bg-alt);
      border-right: 1px solid var(--border);
    }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); }
    .sidebar .search { border-bottom: 1px solid var(--border); }
    .sidebar .search input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }
    .sidebar .search input::placeholder { color: var(--text-dim); }
    .sidebar .search .clear-button svg { fill: var(--text-dim); }
    .sidebar .search .matching-post { border-bottom: 1px solid var(--border); }
    .sidebar .search h2 { color: var(--accent); border-color: var(--border); }
    .sidebar .search p { color: var(--text-dim); }
    .sidebar .search a { color: var(--text); }

    .app-name-link {
      color: var(--heading) !important;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .sidebar-nav li > p {
      font-weight: 700;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72em;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 1.4em 0 0.4em;
      padding-top: 0.8em;
      border-top: 1px solid var(--border);
    }
    .sidebar-nav li:first-child > p { border-top: none; padding-top: 0; }

    .sidebar-nav a {
      color: var(--text-dim);
      border-left: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    .sidebar-nav a:hover { color: var(--text); }
    .sidebar-nav li.active > a {
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 600;
    }

    .sidebar-toggle {
      background: var(--bg-alt);
    }
    .sidebar-toggle span { background-color: var(--text-dim); }

    /* Content */
    .content { background: var(--bg); }
    .markdown-section {
      color: var(--text);
      max-width: 900px;
    }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      color: var(--heading);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }
    .markdown-section h1 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3em;
    }
    .markdown-section h2 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.25em;
      margin-top: 2em;
      color: var(--accent);
    }
    .markdown-section a { color: var(--accent); }
    .markdown-section a:hover { color: var(--heading); }
    .markdown-section strong { color: var(--heading); }
    .markdown-section em { color: var(--text-dim); }
    .markdown-section hr { border-bottom: 1px solid var(--border); }

    .markdown-section code {
      background: var(--code-bg);
      color: #7ee8d8;
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
    }
    .markdown-section pre {
      background: var(--code-bg) !important;
      border: 1px solid var(--border);
    }
    .markdown-section pre > code { background: transparent; border: none; }

    .markdown-section table { display: table; width: 100%; }
    .markdown-section table tr { background: var(--bg); border-top: 1px solid var(--border); }
    .markdown-section table tr:nth-child(2n) { background: var(--bg-alt); }
    .markdown-section table td, .markdown-section table th { border: 1px solid var(--border); }

    .app-name-link img { border-radius: 6px; }

    ::selection { background: rgba(53, 209, 193, 0.25); color: var(--heading); }

    #app { color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>
  <div id="app">Chargement...</div>
  <script>
    window.$docsify = {
      name: '📚 Comptes Rendus',
      nameLink: '/',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      autoHeader: false,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Rechercher...',
        noData: 'Aucun résultat trouvé.',
        depth: 4
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
